services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: moviehub-local-dev
      POSTGRES_DB: moviehub
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - moviehub_pgdata:/var/lib/postgresql/data
      - ../moviehub_dump.sql:/docker-entrypoint-initdb.d/001-moviehub.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d moviehub"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  moviehub_pgdata:
